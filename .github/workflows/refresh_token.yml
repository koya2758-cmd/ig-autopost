name: refresh-token

# Instagram 長期トークンは60日で失効する。毎月1日に更新して期限を延ばす。
on:
  schedule:
    - cron: "17 0 1 * *"  # 毎月1日 09:17 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: トークン更新
        id: refresh
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          res=$(curl -sS -G "https://graph.instagram.com/refresh_access_token" \
            --data-urlencode "grant_type=ig_refresh_token" \
            --data-urlencode "access_token=${IG_ACCESS_TOKEN}")
          token=$(echo "$res" | jq -r '.access_token // empty')
          if [ -z "$token" ]; then
            echo "更新失敗: $(echo "$res" | jq -c '.error // .')"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "有効期限: $(echo "$res" | jq -r '.expires_in') 秒"

      - name: Secret を上書き
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_TOKEN: ${{ steps.refresh.outputs.token }}
        run: gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" --body "$NEW_TOKEN"
